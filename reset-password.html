<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Couple — Новий пароль ❤️</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fff);
        }

        .box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6f91;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            text-align: center;
        }

        .login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #ff5c83;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Новий пароль ❤️</h1>

    <form id="resetForm">

        <input
            type="password"
            id="newPassword"
            placeholder="Новий пароль"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Повторіть пароль"
            minlength="6"
            required
        >

        <button id="resetButton" type="submit">
            Змінити пароль ❤️
        </button>

    </form>

    <div class="message" id="message"></div>

    <a class="login" href="login.html">
        Повернутися до входу
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://uozokpguesqeiprxnijm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xhT8kGREbdjnZTe2B4Fndw_N8E7yFK0";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("resetButton");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
        message.textContent = "❌ Паролі не співпадають";
        return;
    }

    button.disabled = true;
    message.textContent = "Змінюємо пароль...";

    const { error } =
        await supabaseClient.auth.updateUser({
            password: newPassword
        });

    if (error) {
        message.textContent = "❌ " + error.message;
        button.disabled = false;
        return;
    }

    message.textContent =
        "✅ Пароль успішно змінено!";

    setTimeout(() => {
        window.location.href = "/login.html";
    }, 1500);

});

</script>

</body>
</html>
