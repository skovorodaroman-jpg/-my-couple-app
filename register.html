<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Couple — Реєстрація ❤️</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fff);
        }

        .box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6f91;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            margin-top: 15px;
            text-align: center;
        }

        .login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #ff5c83;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Створити акаунт ❤️</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Твоє ім'я"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Пароль"
            minlength="6"
            required
        >

        <input
            type="password"
            id="password2"
            placeholder="Повторіть пароль"
            minlength="6"
            required
        >

        <button type="submit">
            Зареєструватися ❤️
        </button>

    </form>

    <div class="message" id="message"></div>

    <a class="login" href="login.html">
        Вже маєте акаунт? Увійти
    </a>

</div>

<script>

const SUPABASE_URL = "https://uozokpguesqeiprxnijm.supabase.co";

// ВСТАВ СЮДИ СВІЙ СПРАВЖНІЙ sb_publishable_ КЛЮЧ
const SUPABASE_KEY = "sb_publishable_xhT8kGREbdjnZTe2B4Fndw_N8E7yFK0";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = form.querySelector("button");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    if (password !== password2) {
        message.textContent = "❌ Паролі не збігаються";
        return;
    }

    button.disabled = true;
    message.textContent = "🔄 Реєструємо акаунт...";

    try {

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    name: name
                }
            }
        });

        console.log("Supabase:", data, error);

        if (error) {
            message.textContent = "❌ " + error.message;
            return;
        }

        if (data && data.user) {
            message.textContent =
                "✅ Акаунт створено! Перевірте свою електронну пошту.";
        } else {
            message.textContent =
                "⚠️ Не вдалося отримати дані користувача.";
        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

    } finally {

        button.disabled = false;

    }

});

</script>

</body>
</html>
