<!doctype html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Реєстрація ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe5ef, #fff);
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #e84c82;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .code-info {
            background: #fff1f6;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #e84c82;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Створити акаунт ❤️</h1>

    <p class="subtitle">
        Створіть свій акаунт у My Couple
    </p>

    <form id="registerForm">

        <input
            id="name"
            type="text"
            placeholder="Ваше ім'я"
            required
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            minlength="6"
            required
        >

        <div class="code-info">
            💕 Якщо вас запросив партнер, введіть код його пари.
            <br><br>
            Якщо ви створюєте нову пару — залиште поле порожнім.
        </div>

        <input
            id="inviteCode"
            type="text"
            placeholder="Код пари, наприклад 7777ED44"
            maxlength="8"
            style="text-transform:uppercase;"
        >

        <button id="registerButton" type="submit">
            Зареєструватися ❤️
        </button>

    </form>

    <div id="message" class="message"></div>

    <a class="link" href="/login.html">
        Уже є акаунт? Увійти
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!window.supabaseClient) {
        message.innerHTML = "❌ Помилка підключення Supabase";
        return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const inviteCode = document
        .getElementById("inviteCode")
        .value
        .trim()
        .toUpperCase();

    button.disabled = true;
    button.textContent = "Реєстрація...";

    message.innerHTML = "";

    const { data, error } =
        await window.supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    name: name,
                    invite_code: inviteCode || null
                },

                emailRedirectTo:
                    "https://my-couple-app-six.vercel.app/index.html"
            }
        });

    if (error) {

        message.innerHTML =
            "❌ " + error.message;

        button.disabled = false;
        button.textContent = "Зареєструватися ❤️";

        return;
    }

    message.innerHTML = `
        <div style="color:#e84c82;">
            ❤️ Реєстрацію успішно створено!
            <br><br>
            Перевірте свою електронну пошту
            та підтвердьте email.
            <br><br>
            Після підтвердження ви будете
            автоматично приєднані до пари.
        </div>
    `;

});

</script>

</body>
</html>
